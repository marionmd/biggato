<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="title">
  <title id="title">Biggato</title>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="240" rx="28" fill="#0b1020"/>

  <g filter="url(#glow)" stroke="url(#neon)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears, drawn first so the head covers their bases -->
    <path d="M62 100 L80 32 L122 72 Z" fill="#0b1020"/>
    <path d="M198 100 L180 32 L138 72 Z" fill="#0b1020"/>
    <path d="M78 84 L86 52 L106 72 Z" fill="url(#neon)" fill-opacity="0.35" stroke="none"/>
    <path d="M182 84 L174 52 L154 72 Z" fill="url(#neon)" fill-opacity="0.35" stroke="none"/>
    <!-- head -->
    <ellipse cx="130" cy="132" rx="80" ry="68" fill="#0b1020"/>
    <!-- whiskers -->
    <path d="M58 146 L102 152 M56 162 L102 158 M158 152 L202 146 M158 158 L204 162" fill="none" stroke-width="3"/>
    <!-- mouth -->
    <path d="M130 154 Q124 164 115 160 M130 154 Q136 164 145 160" fill="none" stroke-width="3"/>
  </g>

  <!-- eyes with slit pupils -->
  <path d="M90 126 Q107 106 124 126 Q107 142 90 126 Z" fill="#22c55e"/>
  <path d="M136 126 Q153 106 170 126 Q153 142 136 126 Z" fill="#22c55e"/>
  <ellipse cx="107" cy="125" rx="3" ry="10" fill="#0b1020"/>
  <ellipse cx="153" cy="125" rx="3" ry="10" fill="#0b1020"/>
  <!-- nose -->
  <path d="M123 145 L137 145 L130 154 Z" fill="#f472b6"/>

  <text x="240" y="138" fill="url(#neon)" filter="url(#glow)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="800" letter-spacing="4">BIGGATO</text>
  <text x="243" y="178" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">the sassy AI code agent with nine lives</text>
</svg>
